<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="app.title">Une Étape à la Fois</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/spice/spice.css" />
  <link rel="stylesheet" href="/magic-todo/magic-todo.css" />
  <link rel="stylesheet" href="/formalizer/formalizer.css" />
  <link rel="stylesheet" href="/tool-history/tool-history.css" />
  <link rel="stylesheet" href="/tool-help/tool-help.css" />
  <link rel="stylesheet" href="/copy-text/copy-text.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("gt_theme");
      var theme = saved === "light" || saved === "dark"
        ? saved
        : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img class="logo" src="/assets/logo-une-étape-à-la-fois-svg.svg" alt="Une Étape à la Fois" />
      <span class="brand-text">Une Étape à la Fois<span class="brand-sub">local</span></span>
    </a>
    <span id="nav-greeting" class="nav-greeting"></span>
    <nav class="nav">
      <button type="button" id="theme-toggle" class="theme-toggle" title="Passer au mode sombre" aria-label="Passer au mode sombre" aria-pressed="false">🌙</button>
      <select id="lang-select" class="lang-select" aria-label="Langue">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <span id="ai-status" class="ai-status" title="Statut du fournisseur IA" aria-label="Statut du fournisseur IA">●</span>
      <a href="#/history" data-i18n-attr="title|app.nav.history" title="Historique">🕘</a>
      <a href="#/settings" data-i18n-attr="title|app.nav.settings" title="Réglages">⚙️</a>
      <a href="#/account" data-i18n-attr="title|app.nav.account" title="Compte">👤</a>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="foot" data-i18n="app.footer">Quand ça paraît trop grand, trop compliqué · inspiré de goblin.tools</footer>

  <div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal__backdrop"></div>
  <div class="modal__panel">
    <h2 id="modal-title" style="margin:0 0 10px"></h2>
    <p id="modal-message" style="margin:0 0 18px;color:var(--muted)"></p>
    <div id="modal-actions" style="display:flex;gap:10px;justify-content:flex-end"></div>
  </div>
</div>

  <script src="/i18n.js"></script>
<script src="/spice/spice.js"></script>
  <script src="/tool-help/tool-help.js"></script>
  <script src="/copy-text/copy-text.js"></script>
  <script src="/magic-todo/magic-todo.js"></script>
  <script src="/formalizer/formalizer.js"></script>
  <script src="/tool-history/tool-history.js"></script>
  <script src="/app.js"></script>
</body>
</html>
