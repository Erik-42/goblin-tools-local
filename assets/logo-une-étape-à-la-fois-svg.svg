<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Une Étape à la Fois : un chemin de pierres dont seule la première est éclairée, avec un petit gobelin à la lanterne">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#F2E9DA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FFD98A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF6EE" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FBF6EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FBF6EE" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- fond arrondi -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#fond)"/>

  <!-- halo de la première pierre -->
  <circle cx="150" cy="360" r="120" fill="url(#halo)"/>

  <!-- chemin de pierres : chaque pierre plus petite et plus pâle -->
  <g>
    <!-- pierre 1 : la seule pleinement éclairée -->
    <ellipse cx="150" cy="360" rx="52" ry="30" fill="#2A9D8F"/>
    <ellipse cx="150" cy="352" rx="52" ry="30" fill="#3FB8A8"/>
    <ellipse cx="150" cy="349" rx="34" ry="16" fill="#6FD1C3" opacity="0.7"/>

    <!-- pierre 2 -->
    <ellipse cx="232" cy="308" rx="38" ry="22" fill="#E8806B"/>
    <ellipse cx="232" cy="303" rx="38" ry="22" fill="#F0967F"/>
    <ellipse cx="232" cy="301" rx="24" ry="11" fill="#F7B3A0" opacity="0.55"/>

    <!-- pierre 3 -->
    <ellipse cx="296" cy="252" rx="30" ry="17" fill="#7FB5A8"/>
    <ellipse cx="296" cy="248" rx="30" ry="17" fill="#94CBBE"/>
    <ellipse cx="296" cy="246" rx="18" ry="8" fill="#B8DDD4" opacity="0.45"/>

    <!-- pierre 4 -->
    <ellipse cx="350" cy="204" rx="24" ry="13" fill="#B5A38A"/>
    <ellipse cx="350" cy="201" rx="24" ry="13" fill="#C8B99F"/>
    <ellipse cx="350" cy="199" rx="14" ry="6" fill="#DCD0B9" opacity="0.4"/>

    <!-- pierre 5 : à peine visible -->
    <ellipse cx="396" cy="164" rx="18" ry="10" fill="#D8CDBB"/>
    <ellipse cx="396" cy="162" rx="18" ry="10" fill="#E4DCCC"/>
    <ellipse cx="396" cy="160" rx="10" ry="4" fill="#EFE7D8" opacity="0.4"/>
  </g>

  <!-- brume qui estompe les pierres lointaines -->
  <rect x="230" y="80" width="282" height="260" fill="url(#brume)"/>

  <!-- petit gobelin à la lanterne, derrière la première pierre -->
  <g transform="translate(108, 236)">
    <!-- oreilles pointues -->
    <path d="M -6 -18 L -24 -44 L -14 -12 Z" fill="#5A8F4E"/>
    <path d="M 46 -18 L 64 -44 L 54 -12 Z" fill="#5A8F4E"/>
    <!-- tête -->
    <circle cx="20" cy="10" r="30" fill="#6BA85C"/>
    <!-- frange -->
    <path d="M -8 -12 Q 20 -34 48 -12 Q 34 -18 20 -16 Q 6 -18 -8 -12 Z" fill="#557F45"/>
    <!-- yeux -->
    <circle cx="9" cy="8" r="5" fill="#2F3B2A"/>
    <circle cx="31" cy="8" r="5" fill="#2F3B2A"/>
    <circle cx="10.5" cy="6.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="32.5" cy="6.5" r="1.6" fill="#FFFFFF"/>
    <!-- sourire -->
    <path d="M 12 22 Q 20 28 28 22" stroke="#2F3B2A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- lanterne tenue devant -->
    <line x1="44" y1="26" x2="58" y2="46" stroke="#4A3B28" stroke-width="4" stroke-linecap="round"/>
    <circle cx="58" cy="46" r="11" fill="#FFD98A"/>
    <circle cx="58" cy="46" r="11" fill="none" stroke="#B8863B" stroke-width="3"/>
    <circle cx="58" cy="46" r="4.5" fill="#FFF3D0"/>
  </g>

  <!-- lueur de la lanterne -->
  <circle cx="166" cy="282" r="34" fill="url(#halo)"/>
</svg>